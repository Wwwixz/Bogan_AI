<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Вход - Bogan AI{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #14b8a6;
            color: white;
            box-shadow: none;
        }
        .btn-primary {
            background-color: #14b8a6;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #0d9488;
        }
        .auth-link {
            color: #14b8a6;
            text-decoration: none;
        }
        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h2 class="text-center mb-4">Вход в Bogan AI</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post">
            <div class="mb-3">
                <label class="form-label small text-secondary">Имя пользователя</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
            <p class="text-center small text-secondary mb-0">
                Нет аккаунта? <a href="{{ url_for('register') }}" class="auth-link">Зарегистрироваться</a>
            </p>
        </form>
    </div>
</body>

</html>
