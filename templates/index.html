{% extends "base.html" %}
{% block title %}Чат{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Общение с ИИ</h5>
            </div>
            <!-- Область сообщений -->
            <div class="card-body chat-box" id="chat-box" style="height: 60vh; overflow-y: auto;">
                {% for msg in messages %}
                    <div class="message {{ msg.role }}">
                        {{ msg.content }}
                    </div>
                {% endfor %}
            </div>
            <!-- Форма отправки -->
            <div class="card-footer bg-white">
                <form method="post" action="/" class="input-group">
                    <input type="text" name="message" class="form-control" placeholder="Введите сообщение..." autocomplete="off" required>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
